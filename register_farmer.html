{% extends 'base.html' %}

{% block title %}Assisted Farmer Registration — KisanSetu{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto py-4">
    <div class="bg-white rounded-3xl p-6 sm:p-8 border border-stone-200 shadow-md">
        
        <!-- Header -->
        <div class="flex items-center justify-between pb-6 border-b border-stone-200">
            <div>
                <span class="text-xs font-bold uppercase tracking-wider text-agri-700">Assisted Help Desk Mode</span>
                <h1 class="text-2xl font-bold text-stone-900 mt-1">Register Farmer on Behalf / किसान पंजीकरण</h1>
                <p class="text-xs text-stone-500 mt-0.5">For farmers without smartphones or digital internet access.</p>
            </div>
            <a href="{{ url_for('operator.dashboard') }}" class="text-xs font-semibold text-stone-500 hover:text-stone-800">
                ← Operator Desk
            </a>
        </div>

        <!-- Assisted Registration Form -->
        <form method="POST" action="{{ url_for('operator.register_farmer') }}" class="space-y-5 mt-6">
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="name" class="block text-xs font-bold uppercase tracking-wider text-stone-700 mb-1">
                        Farmer Full Name / किसान का नाम <span class="text-rose-600">*</span>
                    </label>
                    <input 
                        type="text" 
                        name="name" 
                        id="name" 
                        required 
                        placeholder="e.g. Ramesh Kumar"
                        class="w-full px-4 py-2.5 rounded-xl border border-stone-300 focus:outline-none focus:ring-2 focus:ring-agri-600 text-sm"
                    >
                </div>

                <div>
                    <label for="mobile" class="block text-xs font-bold uppercase tracking-wider text-stone-700 mb-1">
                        Mobile Number / मोबाइल नंबर <span class="text-rose-600">*</span>
                    </label>
                    <input 
                        type="tel" 
                        name="mobile" 
                        id="mobile" 
                        required 
                        pattern="[0-9]{10}"
                        maxlength="10"
                        placeholder="10-digit mobile number"
                        class="w-full px-4 py-2.5 rounded-xl border border-stone-300 focus:outline-none focus:ring-2 focus:ring-agri-600 text-sm"
                    >
                </div>
            </div>

            <!-- Village, District, State -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label for="village" class="block text-xs font-semibold text-stone-700 mb-1">
                        Village / ग्राम <span class="text-rose-600">*</span>
                    </label>
                    <input 
                        type="text" 
                        name="village" 
                        id="village" 
                        required 
                        placeholder="Village name"
                        class="w-full px-3 py-2 rounded-xl border border-stone-300 focus:outline-none focus:ring-2 focus:ring-agri-600 text-sm"
                    >
                </div>

                <div>
                    <label for="district" class="block text-xs font-semibold text-stone-700 mb-1">
                        District / ज़िला <span class="text-rose-600">*</span>
                    </label>
                    <input 
                        type="text" 
                        name="district" 
                        id="district" 
                        required 
                        value="Raipur"
                        class="w-full px-3 py-2 rounded-xl border border-stone-300 focus:outline-none focus:ring-2 focus:ring-agri-600 text-sm"
                    >
                </div>

                <div>
                    <label for="state" class="block text-xs font-semibold text-stone-700 mb-1">
                        State / राज्य <span class="text-rose-600">*</span>
                    </label>
                    <input 
                        type="text" 
                        name="state" 
                        id="state" 
                        required 
                        value="Chhattisgarh"
                        class="w-full px-3 py-2 rounded-xl border border-stone-300 focus:outline-none focus:ring-2 focus:ring-agri-600 text-sm"
                    >
                </div>
            </div>

            <!-- Crop & Land -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="crop_type" class="block text-xs font-semibold text-stone-700 mb-1">
                        Crop Type / मुख्य फसल <span class="text-rose-600">*</span>
                    </label>
                    <select 
                        name="crop_type" 
                        id="crop_type" 
                        required 
                        class="w-full px-3 py-2.5 rounded-xl border border-stone-300 focus:outline-none focus:ring-2 focus:ring-agri-600 text-sm bg-white"
                    >
                        {% for crop in crops %}
                            <option value="{{ crop }}">{{ crop }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label for="land_area" class="block text-xs font-semibold text-stone-700 mb-1">
                        Cultivated Land (Acres) / भूमि (एकड़)
                    </label>
                    <input 
                        type="number" 
                        step="0.1" 
                        min="0" 
                        name="land_area" 
                        id="land_area" 
                        value="5.0"
                        class="w-full px-3 py-2 rounded-xl border border-stone-300 focus:outline-none focus:ring-2 focus:ring-agri-600 text-sm"
                    >
                </div>
            </div>

            <!-- Mock Verification Checkbox -->
            <div class="p-4 rounded-2xl bg-amber-50 border border-amber-200">
                <label class="flex items-start space-x-3 cursor-pointer">
                    <input type="checkbox" name="auto_verify" value="1" checked class="mt-0.5 rounded border-amber-400 text-agri-700 focus:ring-agri-600">
                    <div class="text-xs text-stone-700 leading-relaxed">
                        <strong class="text-stone-900 block font-bold">Simulate Demo Aadhaar KYC Immediately (तत्काल सत्यापन सिम्युलेट करें)</strong>
                        <span>Auto-verify this farmer during registration to enable immediate slot booking. Fictional demo reference (e.g. DEMO-FARMER-XXXX) will be assigned.</span>
                    </div>
                </label>
            </div>

            <!-- Submit -->
            <div>
                <button 
                    type="submit" 
                    class="w-full py-3.5 px-4 rounded-xl bg-agri-700 hover:bg-agri-600 text-white font-bold text-sm shadow-md transition duration-150 flex items-center justify-center space-x-2"
                >
                    <span>Register Farmer &amp; Proceed to Slot Booking</span>
                    <span>→</span>
                </button>
            </div>

        </form>

    </div>
</div>
{% endblock %}
